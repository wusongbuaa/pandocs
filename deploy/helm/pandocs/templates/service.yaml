apiVersion: v1
kind: Service
metadata:
  name: {{ include "pandocs.fullname" . }}
  labels:
    {{- include "pandocs.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "pandocs.selector" (dict "root" . "component" "web") | nindent 4 }}
