{{- if not .Values.storage.s3.bucket }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "pandocs.fullname" . }}-data
  labels:
    {{- include "pandocs.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.storage.local.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.local.size }}
{{- end }}
