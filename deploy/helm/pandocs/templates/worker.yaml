{{- if .Values.worker.separate }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pandocs.fullname" . }}-worker
  labels:
    {{- include "pandocs.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "pandocs.selector" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    {{- include "pandocs.pod" (dict "root" . "component" "worker" "roles" "worker" "resources" (.Values.worker.resources | default .Values.resources)) | nindent 4 }}
{{- end }}
