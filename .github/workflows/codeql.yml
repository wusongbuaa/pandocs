name: CodeQL

# Looks for vulnerabilities in the TypeScript, the Go and the Python, on every change and once a week, since the
# queries get better even when the code does not change. Findings are under Security, Code scanning.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: javascript-typescript, build-mode: none }
          - { language: python, build-mode: none }
          - { language: actions, build-mode: none }
          # Go is read while it is compiled, and its two modules are not at the root.
          - { language: go, build-mode: manual }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: "**/go.sum"
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # The copy of the Rspress theme is someone else's code, kept as it is.
          config: |
            paths-ignore:
              - packages/web/vendor
              - "**/dist"
              - sdks/go/client.gen.go
      - if: matrix.language == 'go'
        run: |
          (cd cli && go build ./...)
          (cd sdks/go && go build ./...)
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
