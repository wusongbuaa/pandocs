name: Pull request title

# A pull request is squashed into one commit with its title, so the title is the commit message the history keeps.
# It follows Conventional Commits, as CONTRIBUTING says.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      # Reads only the title, and checks out nothing, which is what keeps pull_request_target safe here.
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          # Dependabot's titles start with a capital: "Bump ...".
          subjectPattern: ^.+$
