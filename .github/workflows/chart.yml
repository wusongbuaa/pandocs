name: Chart

on:
  push:
    branches: [main]
    paths: ["deploy/helm/**", "test/helm/**", ".github/workflows/chart.yml"]
  pull_request:
    paths: ["deploy/helm/**", "test/helm/**", ".github/workflows/chart.yml"]

permissions:
  contents: read

jobs:
  # On a real cluster: several replicas, an update under load, and losing the publishing pod.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: go install sigs.k8s.io/kind@v0.33.0
      - run: helm lint deploy/helm/pandocs --set url=https://docs.example.com,existingSecret=s,storage.s3.bucket=b
      - run: docker build -t pandocs:local .
      - run: docker pull postgres:18-alpine && docker pull rustfs/rustfs:1.0.4
      - run: test/helm/run.sh
