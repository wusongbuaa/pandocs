name: Scorecard

# OpenSSF Scorecard: how the repository measures against the checks people use to decide whether to depend on a
# project. The results are public, behind the badge in the README, and under Security, Code scanning.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"
  # So that changing the branch protection shows up without waiting for the week.
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      security-events: write
      # To publish the results, which the badge reads.
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scorecard
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
