<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Docs</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script src="/theme-init.js"></script>
    <style>
      /* Until the app has loaded: the shape of the page, on the theme's own background, a moment later so a fast load shows nothing. */
      /* Scrollbars come and go with what is on a page and what covers it, and nothing should move when they do. */
      html { scrollbar-gutter: stable; }
      :where(body) { background: #fff; }
      :where(html.dark body) { background: #121212; }
      .pd-boot { --pd-boot-line: rgba(127, 127, 127, 0.16); position: fixed; inset: 0; animation: pd-boot-in 0.2s 0.25s both; }
      .pd-boot__nav { height: 64px; border-bottom: 1px solid var(--pd-boot-line); }
      .pd-boot__page { max-width: 692px; margin: 48px auto 0; padding: 0 24px; }
      .pd-boot__line { height: 14px; margin-bottom: 18px; background: var(--pd-boot-line); border-radius: 4px; }
      .pd-boot__line--title { width: 40%; height: 30px; margin-bottom: 36px; }
      .pd-boot__line--short { width: 66%; }
      @keyframes pd-boot-in { from { opacity: 0; } to { opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="__rspress_root"><!--pandocs-page-->
      <div class="pd-boot" aria-hidden="true">
        <div class="pd-boot__nav"></div>
        <div class="pd-boot__page">
          <div class="pd-boot__line pd-boot__line--title"></div>
          <div class="pd-boot__line"></div>
          <div class="pd-boot__line"></div>
          <div class="pd-boot__line pd-boot__line--short"></div>
        </div>
      </div>
    <!--/pandocs-page--></div>
    <div id="__rspress_modal_container"></div>
    <!--pandocs-state-->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
